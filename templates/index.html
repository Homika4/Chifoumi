<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Rock Paper Scissor</title>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body style="background-color: #89AAE6; color: white;">


<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
<h1>Rock paper scissor !</h1>
<h2>Pick your stand !</h2>
    </div>
<img src="static/images/standep.png" alt=""/>
</div>

<div class="container">
    <div class="row">
        <div class="col-sm-12 mb-3">
<li><a href="{{ url_for('result',pick_id='Rock') }}" class="btn btn-primary">Rock</a></li>
       </div>
        <div class="col-sm-12 mb-3">
<li><a href="{{ url_for('result',pick_id='Scissor') }}" class="btn btn-primary">Scissor</a></li>
      </div>
        <div class="col-sm-12 mb-5">
<li><a href="{{ url_for('result',pick_id='Paper') }}" class="btn btn-primary">Paper</a></li>
      </div>
        <div class="col-sm-12 mb-3">
<a href="{{ url_for('reset') }}" class="btn btn-success">Reset</a>
      </div>

    </div>
</div>

<div class="container">
    Current score : {{ points }}
    <div class="row justify-content-center">
</div>
</div>


</body>
</html>
